workflow:
  tracker_writer: "Single main integrator updates tracker after every finished task"
  completion_rule: "Mark done only after acceptance verification; record exact commands, exit codes and limitations here and in docs/progress.md"
  review: "Independent reviewer checks finished paths; executor claims do not replace integrator verification"
  ownership: "Assign explicit file ownership before delegation; no concurrent writers to the same file; only integrator changes contracts"
  dependencies: "depends_on IDs are prerequisites; todo tasks have no completion evidence; skipped requires a reason and decision evidence"
